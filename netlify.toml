[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"
  # Lock this Netlify deployment to Agro Monitoring only.
  # Remove or change this variable to expose the full portal.
  VITE_API_BASE_URL = "/farmintelytics-engine/agromonitoring"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
